# ============================================================
# Full Experiment Configuration
# LLMs to the Moon? Reddit Market Sentiment Analysis
# ============================================================
# PRIMARY DATASET: emilpartow/reddit_finance_posts_sp500
# ============================================================

project:
  name: "LLMs to the Moon? Reddit Market Sentiment Analysis"
  version: "1.0.0"
  description: >
    Methodology reproduction of Deng et al. (2023) using
    emilpartow/reddit_finance_posts_sp500 as the public Reddit corpus.
  random_seed: 42
  experiment_id: "full_experiment_v1"

# ── Dataset Configuration ─────────────────────────────────────
dataset:
  source: "emilpartow/reddit_finance_posts_sp500"
  source_url: "https://huggingface.co/datasets/emilpartow/reddit_finance_posts_sp500"
  split: "train"
  # Full distillation run uses 20,000 samples (paper uses 20K Reddit posts)
  distillation_samples: 20000
  # Evaluation pool (never used for training/distillation)
  reddit_gold_samples: 100
  # Development/smoke test sizes
  dev_samples: 100
  validation_samples: 1000
  # Preprocessing
  min_text_length: 15
  max_text_length: 2048
  dedup: true
  seed: 42

# ── Data Split Policy ─────────────────────────────────────────
splits:
  strategy: "chronological"   # time-based split prevents temporal leakage
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

# ── Teacher LLM Configuration ─────────────────────────────────
teacher:
  # Provider options: mock, openai, gemini, anthropic, local
  # DO NOT put API keys here - use .env file
  provider: "mock"          # change to openai/gemini/anthropic for real run
  model: null               # null = use provider default model
  temperature: 0.5          # paper specification: T=0.5
  num_generations: 8        # paper specification: K=8 reasoning paths
  max_tokens: 512
  include_cot: true         # paper: Financial TL;DR before final label
  prompt_version: "1.0.0"
  cache_enabled: true       # cache API calls to avoid re-billing
  max_retries: 3
  retry_delay_seconds: 2.0

# ── Distillation Configuration ────────────────────────────────
distillation:
  # Agreement threshold for filtering (paper: >= 5/8)
  agreement_threshold: 5
  total_paths: 8
  # Run ablations across these thresholds
  threshold_ablations: [5, 6, 7, 8]
  # Student model backbone (original paper: Charformer 102M, unavailable)
  # Modernized replacement: distilbert-base-uncased (66M params)
  student_backbone: "distilbert-base-uncased"
  # Training parameters
  learning_rate: 3.0e-5
  batch_size: 16
  epochs: 5
  max_length: 256
  weight_decay: 0.01
  early_stopping_patience: 2
  seed: 42

# ── Sentiment Labels ──────────────────────────────────────────
sentiment:
  classes:
    - positive    # Bullish
    - neutral     # Neutral
    - negative    # Bearish
  display_classes:
    - BULLISH
    - NEUTRAL
    - BEARISH
  # Three-class evaluation (Reddit corpus)
  reddit_num_classes: 3
  # Binary evaluation (FiQA - paper protocol)
  fiqa_num_classes: 2

# ── Evaluation Configuration ──────────────────────────────────
evaluation:
  # Reddit gold evaluation
  reddit_gold_samples: 100
  reddit_split_seed: 42
  # FiQA benchmark
  fiqa_dataset: "pauri32/fiqa-2018"
  fiqa_subtasks:
    - news
    - post
  # Metrics for three-class Reddit evaluation
  metrics_reddit:
    - accuracy
    - macro_f1
    - weighted_f1
    - per_class_precision
    - per_class_recall
    - per_class_f1
  # Metrics for binary FiQA evaluation
  metrics_fiqa:
    - accuracy
    - binary_f1
    - precision
    - recall
  # Regression threshold tuning
  regression_theta_min: -0.5
  regression_theta_max: 0.5
  regression_theta_steps: 21

# ── Ablation Study Configuration ─────────────────────────────
ablations:
  # Number of reasoning paths ablation
  reasoning_paths:
    k_values: [1, 2, 4, 8]
    k_values_extended: [1, 2, 4, 8, 16]
    max_eval_samples: 50
  # CoT vs direct prompt ablation
  cot:
    include_cot: true
    direct_only: false
    max_eval_samples: 50
  # Demonstration ordering ablation
  demo_order:
    seeds: [42, 101, 2024, 7, 999]
    max_eval_samples: 30
  # Agreement threshold ablation
  agreement_threshold:
    thresholds: [5, 6, 7, 8]
  # Classification vs regression ablation
  cls_vs_regression:
    thresholds: [5, 6, 7, 8]

# ── Baseline Models ───────────────────────────────────────────
baselines:
  vader:
    positive_threshold: 0.05
    negative_threshold: -0.05
  classical_ml:
    tfidf_max_features: 10000
    tfidf_ngram_range: [1, 2]
    logreg_C: [0.01, 0.1, 1.0, 10.0]
    svm_C: [0.01, 0.1, 1.0, 10.0]
  finbert:
    models:
      - "ProsusAI/finbert"
      - "yiyanghkust/finbert-tone"
    batch_size: 16
    max_length: 512

# ── Financial Extension ───────────────────────────────────────
finance:
  enabled: true
  return_horizons_days: [1, 3, 5]
  aggregation_method: "mean"
  market_open_hour: 9    # US Eastern Time
  market_close_hour: 16  # US Eastern Time
  timezone: "US/Eastern"
  min_posts_per_day: 1
  top_tickers: ["AAPL", "TSLA", "MSFT", "NVDA", "GME", "GOOGL", "SPY", "AMZN", "META", "AMD"]

# ── Output Paths ──────────────────────────────────────────────
outputs:
  base: "outputs/"
  teacher: "outputs/teacher/"
  distillation: "outputs/distillation/"
  student_regression: "outputs/student/regression/"
  student_classification: "outputs/student/classification/"
  benchmarks: "outputs/benchmarks/"
  ablations: "outputs/ablations/"
  error_analysis: "outputs/error_analysis/"
  figures: "outputs/figures/"
  finance: "outputs/finance/"
  archive: "outputs/archive/"
  reference_paper: "outputs/reference_paper/"

# ── Reproducibility ───────────────────────────────────────────
reproducibility:
  # All random seeds are derived from this base seed
  base_seed: 42
  # Model checkpointing
  save_best_only: true
  checkpoint_metric: "val_mse"    # for regression
  checkpoint_mode: "min"
  # Prompt version tracking
  prompt_version: "1.0.0"
  # Dataset version
  dataset_version: "main"

# ── Development Shortcuts ─────────────────────────────────────
development:
  # Quick sanity check with 100 samples (no API cost in mock mode)
  smoke_samples: 10
  smoke_epochs: 1
  smoke_batch_size: 4
  # Validation run (1000 samples, optional API)
  validation_samples: 1000
  validation_epochs: 2
