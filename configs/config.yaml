# ============================================================
# Master Configuration — Reddit Market Sentiment Analysis
# ============================================================

project:
  name: "LLMs to the Moon? Reddit Market Sentiment Analysis"
  version: "1.0.0"
  random_seed: 42

dataset:
  name: "reddit_financial_sentiment"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  subreddits:
    - wallstreetbets
    - stocks
    - investing
    - StockMarket
  min_text_length: 10
  max_text_length: 2048
  date_range:
    start: null  # determined by available data
    end: null

sentiment:
  classes:
    - BULLISH
    - NEUTRAL
    - BEARISH
  class_map:
    positive: BULLISH
    neutral: NEUTRAL
    negative: BEARISH
    bullish: BULLISH
    bearish: BEARISH

models:
  vader:
    positive_threshold: 0.05
    negative_threshold: -0.05
  classical_ml:
    tfidf_max_features: 10000
    tfidf_ngram_range: [1, 2]
    logreg_C: [0.01, 0.1, 1.0, 10.0]
    svm_C: [0.01, 0.1, 1.0, 10.0]
  finbert:
    models:
      - "ProsusAI/finbert"
      - "yiyanghkust/finbert-tone"
    batch_size: 16
    max_length: 512

experiments:
  debug_samples: 100
  validation_samples: 1000
  full_mode: false  # set true for full dataset
  max_samples: null  # null = use all available

finance:
  return_horizons: [1, 3, 5]
  aggregation_method: "mean"  # or "median"
  market_open_hour: 9   # ET
  market_close_hour: 16  # ET
  timezone: "US/Eastern"
  min_posts_per_day: 1
