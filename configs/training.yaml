# ============================================================
# Distillation & Student Model Training Configuration
# ============================================================

training:
  # General optimization
  random_seed: 42
  device: "cpu" # "cpu" or "cuda"

  # Distillation targets & objectives
  objectives:
    regression:
      loss_fn: "MSELoss" # "MSELoss" or "SmoothL1Loss"
      target_column: "teacher_soft_score" # continuous in [-1.0, 1.0]
      learning_rate: 3.0e-5
      weight_decay: 0.01
      epochs: 3
      batch_size: 16
      warmup_ratio: 0.1
      threshold_tuning:
        search_range: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
        metric: "macro_f1"

    classification:
      loss_fn: "CrossEntropyLoss"
      target_column: "teacher_majority_label" # 3 classes: 0=bearish, 1=neutral, 2=bullish
      learning_rate: 3.0e-5
      weight_decay: 0.01
      epochs: 3
      batch_size: 16
      warmup_ratio: 0.1

  # Paper reference: learning_rate = 1e-4, batch_size = 64 on Charformer
  paper_reference:
    learning_rate: 1.0e-4
    batch_size: 64

  # Early stopping & checkpointing
  early_stopping:
    patience: 2
    monitor: "val_macro_f1"
    mode: "max"

  checkpoints:
    save_best_only: true
    checkpoint_dir: "outputs/models"
